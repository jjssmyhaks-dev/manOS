name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all packages
        run: |
          set -e
          for p in packages/db packages/core packages/agents packages/connectors packages/evals apps/web; do
            echo "::group::tsc $p"
            npx tsc --noEmit -p "$p"
            echo "::endgroup::"
          done

      - name: Eval suite (21 golden cases)
        run: npm test -w packages/evals

      - name: Golden routing gate (120 cases)
        run: npm run test:golden -w packages/evals

      - name: Document benchmark (≥95% auto-processing gate)
        run: npm run test:documents -w packages/evals

      - name: Telemetry P2b end-to-end verification
        run: npm run verify:telemetry -w packages/evals

      - name: Forecast-accuracy surfaces verification
        run: npm run verify:forecast-accuracy -w packages/evals

      - name: Write audit (every DB write on the trust path)
        run: npm run audit:writes -w packages/agents

      - name: Production build
        run: npm run build
        env:
          FACTORY_DB_MEMORY: '1' # keep the build hermetic — no disk PGlite writes

      - name: Operator smoke test (server boots, agent sweep runs)
        run: |
          npm run start -w apps/web &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/ && break
            sleep 1
          done
          SMOKE_RC=0
          npm run smoke -w apps/web || SMOKE_RC=$?
          kill $SERVER_PID || true
          exit $SMOKE_RC
        env:
          FACTORY_DB_MEMORY: '1'
